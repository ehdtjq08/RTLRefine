name: Exported general RTL regressions
"on":
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exported-regression-cycle:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog bubblewrap util-linux
      - name: Run exported runners, reintroduce bugs and restore source
        run: python3 -I scripts/check_general_project_ci.py --output ci-results
      - name: Check optimized runner against the frozen grader
        run: |
          python3 -m pip install --disable-pip-version-check pytest==8.4.2
          python3 -m pytest -q tests/test_project_execution.py
      - name: Save every phase and its JUnit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: general-project-regression-cycle
          path: ci-results/
          retention-days: 90
